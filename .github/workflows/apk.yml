name: Bina APK
on:
  workflow_run:
    workflows: ['Terbit ke GitHub Pages']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      BUBBLEWRAP_KEYSTORE_PASSWORD: lepaktune123
      BUBBLEWRAP_KEY_PASSWORD: lepaktune123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Pasang Bubblewrap
        run: |
          npm i -g @bubblewrap/cli
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_SDK_ROOT\"}" > ~/.bubblewrap/config.json
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Tetapkan nombor versi
        run: |
          node -e "const f='twa-manifest.json';const m=require('./'+f);m.appVersionCode=${{ github.run_number }};m.appVersionName='1.0.${{ github.run_number }}';require('fs').writeFileSync(f,JSON.stringify(m,null,2))"
      - name: Jana projek Android
        run: yes | bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json
      - name: Bina APK
        run: yes | bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json
      - name: Namakan APK
        run: |
          mkdir -p out
          cp app-release-signed.apk "out/LepakTune-1.0.${{ github.run_number }}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: LepakTune 1.0.${{ github.run_number }}
          body: APK LepakTune. Install di telefon/tablet Android (benarkan "Install unknown apps").
          files: out/*.apk
          make_latest: true
