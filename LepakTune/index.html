<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14100c" />
  <meta name="description" content="LepakTune: studio lagu peribadi - minus one, vokal saja, tempo, gaya santai." />
  <link rel="icon" href="/lepaktune/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/lepaktune/icons/icon-192.png" />
  <title>LepakTune</title>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="dot">▶</span><div>LepakTune<br><small>Dek Kaset Malam</small></div></div>
      <div class="spacer"></div>
      <span class="chip-stat" id="storageStat" title="Storan digunakan">—</span>
    </header>

    <main class="views">
      <section class="view" id="pemain" data-view></section>
      <section class="view" id="studio" data-view></section>
      <section class="view" id="perpustakaan" data-view></section>
    </main>

    <nav class="tabbar" id="tabbar">
      <button data-tab="pemain"><span class="i">📼</span>Pemain</button>
      <button data-tab="studio"><span class="i">🎛️</span>Studio</button>
      <button data-tab="perpustakaan"><span class="i">📚</span>Perpustakaan</button>
    </nav>
  </div>
  <div class="toasts" id="toasts"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
